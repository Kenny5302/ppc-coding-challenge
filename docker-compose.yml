# NOTE: the fallback credentials below are LOCAL-DEV defaults. Override POSTGRES_PASSWORD and
# API_KEYS via environment/.env for any shared or deployed environment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-users}
    volumes:
      - pgdata:/var/lib/postgresql/data   # persists records across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: base
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-users}
      API_KEYS: ${API_KEYS:-dev-api-key}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; defaults above are for local dev
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db_test:                   # throwaway DB so tests never touch real data
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: users_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d users_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  tests:                     # docker compose --profile test run --rm tests
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://test:test@db_test:5432/users_test
    depends_on:
      db_test:
        condition: service_healthy

volumes:
  pgdata:
